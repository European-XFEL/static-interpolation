[project]
name = "static_interpolation"
version = "0.5.3"

description = "Fast interpolation of panilized detector data. Optimized for static sampling points."
keywords = ["Interpolation","EXtra"]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE*"]
authors = [
    {name="Tim Berberich",email = "tim.berberich@xfel.eu"},
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",  
]
dependencies = [
    "numpy>=2.2.0,<3.0.0",
	"scipy>=1.15.0",	
	"numba>=0.60.0",
	"extra_geom>= 1.11.0",
	"pydantic>=2.12.2"
	#"pyopencl>=2026.1.2",
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/European-XFEL/static-interpolation"

[build-system]
build-backend = "mesonpy"
requires = ["meson-python>=0.19.0,<0.20","meson>=1.8.1,<1.9.0","ninja","wheel","numpy>=2.2.0,<3.0.0","charset-normalizer"]